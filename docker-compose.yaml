services:
  neuronguard-agents:
    build:
      context: .
      dockerfile: Dockerfile
    image: neuronguard-agents:latest
    ports:
      - "${PORT:-8000}:8000"
    env_file: .env
    environment:
      # Override so the API always reaches Redis via the internal service name
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: always
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"

  redis:
    image: redis:7-alpine
    restart: always
    # Conditionally add --requirepass only when REDIS_PASSWORD is set
    command: >
      sh -c "
        if [ -n \"$$REDIS_PASSWORD\" ]; then
          redis-server --requirepass \"$$REDIS_PASSWORD\" --maxmemory 256mb --maxmemory-policy allkeys-lru
        else
          redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
        fi
      "
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    # Not exposed externally — only reachable within the compose network
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  agents-panel:
    build:
      context: ./panel
      dockerfile: Dockerfile
    image: neuronguard-agents-panel:latest
    ports:
      - "3001:3001"
    env_file: .env
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOSTNAME=0.0.0.0
    restart: always

volumes:
  redis-data:
    driver: local
