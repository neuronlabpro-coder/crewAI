services:
  neuronguard-agents:
    build:
      context: .
      dockerfile: Dockerfile
    image: neuronguard-agents:latest
    restart: always
    env_file: .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
    networks:
      - dokploy-network
      - default

networks:
  dokploy-network:
    external: true
